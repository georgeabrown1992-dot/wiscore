name: Weekly FPL data refresh

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run fetch-fpl script
        run: node scripts/fetch-fpl.js

      - name: Run transfer feed scrape
        continue-on-error: true
        run: node scripts/fetch-transfers.js

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in public/fpl-data.json public/gameweek-history.json public/squads.json \
                   public/transfers.json public/transfer-feed.json public/squad-alerts.json \
                   public/fixtures.json index.html; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          git commit -m "chore: daily FPL data refresh"
          for i in 1 2 3; do
            git push && exit 0
            echo "Push rejected — pulling and retrying ($i)."
            git pull --rebase origin main
          done
          git push
