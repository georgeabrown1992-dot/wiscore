<style>
  :root {
    --bg: #0b0b0d;
    --bg-card: #17181b;
    --bg-elevated: #1c1d20;
    --border: #2a2a2e;
    --text: #f6f5f2;
    --text-dim: #c8c7c3;
    --text-mute: #8a8985;
    --accent: #ff3d2e;
    --accent-2: #b8281c;
    --positive: #21e6a1;
    --amber: #caa23a;
    --tier-best: #5b5b56;
    --tier-first: #46453f;
    --tier-sub: #333230;
    --tier-youth: #232320;
    --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Layout */
  .app { min-height: 100vh; display: flex; flex-direction: column; }
  .nav {
    background: #111214;
    border-bottom: 3px solid var(--accent);
    padding: 12px 28px;
    display: flex;
    align-items: center;
    gap: 28px;
    position: sticky; top: 0; z-index: 50;
  }
  .nav-brand { display: flex; align-items: center; gap: 10px; }
  .nav-brand-mark {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .nav-brand-text { font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: 0.01em; color: #f7f7f4; text-transform: uppercase; }
  .nav-brand-sub { font-size: 11px; color: #9a9a94; margin-top: 1px; letter-spacing: 0.02em; }
  .nav-links { display: flex; gap: 4px; margin-left: 16px; }
  .nav-link {
    padding: 8px 14px;
    border-radius: 3px;
    color: #b8b8b1;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .nav-link:hover { color: white; background: rgba(255,255,255,0.08); }
  .nav-link.active { color: white; background: var(--accent); }
  .nav-meta { margin-left: auto; font-size: 12px; color: #9a9a94; text-align: right; }
  .nav-meta-line { line-height: 1.5; }
  .nav-burger { display: none; margin-left: auto; background: none; border: none; padding: 8px; cursor: pointer; }
  .nav-burger span { display: block; width: 22px; height: 2px; background: #f7f7f4; margin: 5px 0; }
  .nav-mobile-panel { display: none; flex-direction: column; gap: 2px; padding: 10px 20px 14px; background: #16161a; border-top: 1px solid rgba(255,255,255,0.08); }
  .nav-mobile-panel .nav-link { width: 100%; }
  @media (max-width: 760px) {
    .nav-links { display: none; }
    .nav-meta { display: none; }
    .nav-burger { display: block; }
    .nav-mobile-panel.open { display: flex; }
  }
  .email-capture { background: #16161a; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 20px 22px; margin-top: 18px; }
  .email-capture h3 { margin: 0 0 4px; font-size: 15px; }
  .email-capture p { margin: 0 0 14px; font-size: 13px; color: #9a9a94; }
  .email-capture-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .email-capture input[type="email"] { flex: 1; min-width: 200px; background: #0e0e10; border: 1px solid rgba(255,255,255,0.12); color: #f7f7f4; padding: 10px 14px; border-radius: 3px; font-size: 14px; }
  .email-capture button { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 3px; font-weight: 600; cursor: pointer; font-size: 14px; }
  .email-capture-note { font-size: 12px; color: #6d6d68; margin-top: 8px; }
  .nav-meta-fresh { color: var(--positive); }
  .nav-meta-stale { color: var(--amber); }

  /* Hero / page header */
  .container { padding: 28px; max-width: 1320px; margin: 0 auto; width: 100%; }
  .page-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .page-title { font-family: var(--font-display); font-size: 34px; font-weight: 700; letter-spacing: 0.01em; margin: 0; text-transform: uppercase; }
  .page-sub { color: var(--text-dim); font-size: 14px; margin-top: 4px; }

  /* Cards */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 22px;
  }
  .card-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin: 0 0 14px 0; font-weight: 600; }

  /* GW slider */
  .gw-bar {
    display: flex; align-items: center; gap: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 18px;
  }
  .gw-label { font-size: 13px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .gw-value { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--accent); min-width: 88px; }
  input[type="range"] {
    flex: 1;
    -webkit-appearance: none; appearance: none;
    height: 6px;
    background: var(--bg-elevated);
    border-radius: 3px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent);
    cursor: pointer; box-shadow: 0 2px 8px rgba(255,61,46,0.5);
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent);
    cursor: pointer; border: none;
  }
  .gw-presets { display: flex; gap: 6px; }
  .gw-preset {
    padding: 6px 12px; border-radius: 6px;
    background: var(--bg-elevated); color: var(--text-dim);
    font-size: 12px; font-weight: 500;
    cursor: pointer; border: 1px solid transparent;
  }
  .gw-preset:hover { color: white; }
  .gw-preset.active { background: var(--accent); color: white; }

  /* Table */
  .league-table { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead { background: var(--bg-elevated); }
  th { text-align: left; padding: 14px 16px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); font-weight: 600; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
  th:hover { color: white; }
  th .sort-ind { color: var(--accent); margin-left: 4px; font-weight: 700; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
  tbody tr { cursor: pointer; transition: background 0.1s; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody tr:last-child td { border-bottom: none; }
  .rank { font-weight: 700; color: var(--text-dim); width: 36px; }
  .club-cell { display: flex; align-items: center; gap: 12px; }
  .club-badge { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: white; letter-spacing: 0.02em; }
  .club-name { font-weight: 600; }
  .wiscore-badge { display: inline-flex; align-items: center; gap: 8px; }
  .wiscore-num { font-family: var(--font-display); font-weight: 700; font-size: 20px; min-width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
  .zone-pill { padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: white; }
  .lp-cell { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .delta { font-size: 11px; color: var(--text-mute); }
  .delta.up { color: var(--positive); }
  .delta.down { color: var(--accent-2); }

  /* Two-up layout */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
  .grid-2 > * { min-width: 0; }
  @media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } }

  /* Club detail */
  .club-hero {
    display: flex; align-items: center; gap: 24px;
    padding: 24px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 18px;
  }
  .club-hero-badge { width: 72px; height: 72px; border-radius: 6px; display: grid; place-items: center; font-size: 20px; font-weight: 800; color: white; flex-shrink: 0; }
  .club-hero-name { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .club-hero-meta { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
  .club-hero-stats { margin-left: auto; display: flex; gap: 28px; }
  .club-stat { text-align: right; }
  .club-stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); font-weight: 600; }
  .club-stat-value { font-family: var(--font-display); font-size: 32px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .club-stat-zone { font-size: 11px; padding: 3px 10px; border-radius: 100px; color: white; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 6px; display: inline-block; }
  @media (max-width: 640px) {
    .club-hero { flex-wrap: wrap; }
    .club-hero-stats { margin-left: 0; width: 100%; flex-direction: column; gap: 16px; }
    .club-stat { text-align: left; }
  }

  /* Injured list */
  .player-row {
    display: grid;
    grid-template-columns: 52px 1fr 80px 60px;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .player-row:last-child { border-bottom: none; }
  .player-tier {
    min-width: 44px; height: 26px; border-radius: 6px;
    padding: 0 8px;
    display: grid; place-items: center;
    font-weight: 700; font-size: 11px;
    color: white;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  .tier-best { background: var(--tier-best); }
  .tier-first { background: var(--tier-first); }
  .tier-sub { background: var(--tier-sub); }
  .tier-youth { background: var(--tier-youth); color: var(--text); }
  .player-name { font-weight: 500; }
  .player-news { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .player-status-tag { font-size: 10px; padding: 2px 8px; border-radius: 100px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .status-i { background: rgba(255,61,46,0.14); color: #ff6b5c; }
  .status-d { background: rgba(202,162,58,0.14); color: var(--amber); }
  .status-s { background: rgba(255,61,46,0.14); color: #ff6b5c; }
  .player-points { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

  .empty-state { padding: 32px; text-align: center; color: var(--text-mute); font-size: 14px; }

  /* Methodology */
  .meth-section { margin-bottom: 28px; }
  .meth-section h3 { font-size: 16px; font-weight: 700; margin: 0 0 10px 0; }
  .meth-section p { color: var(--text-dim); font-size: 14px; line-height: 1.6; margin: 0 0 8px 0; }
  .tier-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
  @media (max-width: 720px) { .tier-grid { grid-template-columns: repeat(2, 1fr); } }
  .tier-card { padding: 14px; background: var(--bg-elevated); border-radius: 10px; border: 1px solid var(--border); }
  .tier-card-name { font-size: 12px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .tier-card-value { font-size: 30px; font-weight: 800; margin: 4px 0; }
  .tier-card-count { font-size: 12px; color: var(--text-dim); }
  .zone-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 12px; }
  @media (max-width: 880px) { .zone-grid { grid-template-columns: repeat(3, 1fr); } }
  .zone-card { padding: 12px; border-radius: 10px; color: white; }
  .zone-card-range { font-weight: 700; font-size: 14px; }
  .zone-card-label { font-size: 12px; opacity: 0.95; margin-top: 2px; }

  /* Misc */
  .pill { display: inline-block; padding: 3px 8px; border-radius: 6px; background: var(--bg-elevated); font-size: 11px; color: var(--text-dim); font-weight: 500; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn {
    padding: 8px 14px; border-radius: 8px;
    background: var(--bg-elevated); color: var(--text);
    border: 1px solid var(--border); font-size: 13px; font-weight: 500;
    cursor: pointer;
  }
  .btn:hover { background: #26272b; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
  .btn-primary:hover { background: #ff6b5c; }
  .alert {
    background: rgba(202,162,58,0.12);
    border: 1px solid rgba(202,162,58,0.35);
    color: var(--amber);
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 18px;
  }
  .loading { padding: 60px; text-align: center; color: var(--text-dim); }

  /* Insights */
  .insights-strip { margin-bottom: 22px; }
  .insights-strip-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 12px; }
  .insights-strip-head h3 { margin:0; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
  .insights-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 900px) { .insights-grid { grid-template-columns: 1fr; } }
  .insight-card { cursor:pointer; display:flex; flex-direction:column; gap:8px; }
  .insight-tag { display:inline-block; align-self:flex-start; background: var(--bg-elevated); color: var(--accent); font-size: 11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding: 3px 9px; border-radius: 100px; }
  .insight-title { font-size: 16px; font-weight: 700; line-height: 1.35; }
  .insight-summary { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
  .insight-meta { font-size: 12px; color: var(--text-mute); margin-top: auto; }
  .insight-list-row { display:flex; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .insight-list-row:hover .insight-title { color: var(--accent); }
  .article-body { font-size: 15px; line-height: 1.75; color: var(--text); white-space: pre-wrap; }
  .article-meta { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }

  /* Search */
  .search-input {
    padding: 8px 14px;
    border-radius: 8px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    width: 220px;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }

  canvas { max-height: 320px !important; }
</style>
</head>

<script>
/* ---------------- Bootstrap data ---------------- */
window.__WI = {};
async function bootstrap() {
  function readEmbedded(id) {
    const el = document.getElementById(id);
    if (!el) return null;
    const txt = el.textContent.trim();
    if (!txt || txt.startsWith('__')) return null;
    try { return JSON.parse(txt); } catch (e) { return null; }
  }
  // Prefer embedded data (works from file://). Fall back to fetch() if missing.
  let squads = readEmbedded('wi-data-squads');
  let fpl = readEmbedded('wi-data-fpl');
  let hist = readEmbedded('wi-data-history');
  let insights = readEmbedded('wi-data-insights');
  let fixtures = readEmbedded('wi-data-fixtures');
  if (!squads) squads = await fetch('public/squads.json').then(r => r.json());
  if (!fpl) fpl = await fetch('public/fpl-data.json').then(r => r.json()).catch(() => null);
  if (!hist) hist = await fetch('public/gameweek-history.json').then(r => r.json()).catch(() => null);
  if (!insights) insights = await fetch('public/insights.json').then(r => r.json()).catch(() => null);
  if (!fixtures) fixtures = await fetch('public/fixtures.json').then(r => r.json()).catch(() => null);
  window.__WI = { squads, fpl, hist, insights, fixtures };
}
</script>

<script type="text/javascript">
/* ---------------- App ---------------- */
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);

// Club badge colours (approximate kit colours)
const CLUB_COLORS = {
  "Arsenal": "#EF0107", "Aston Villa": "#7A003C", "Bournemouth": "#DA291C",
  "Brentford": "#E30613", "Brighton": "#0057B8", "Chelsea": "#034694",
  "Coventry City": "#5BC2E7", "Crystal Palace": "#1B458F", "Everton": "#003399",
  "Fulham": "#000000", "Hull City": "#F5A12D", "Ipswich Town": "#0044A8",
  "Leeds United": "#FFCD00", "Liverpool": "#C8102E", "Manchester City": "#6CABDD",
  "Manchester United": "#DA291C", "Newcastle United": "#241F20",
  "Nottingham Forest": "#DD0000", "Sunderland": "#EB172B",
  "Tottenham Hotspur": "#132257",
};

function zoneFor(score, zones) {
  for (const z of zones) if (score >= z.min) return z;
  return zones[zones.length - 1];
}

/* Compute WIscore for one club from FPL injury status.
 * Uses the per-player continuous score (0.10 – 5.00) from public/squads.json.
 * Falls back to tier weight if the enriched player list is missing.  */
function computeClubWIscore(club, fpl, squads) {
  const tw = squads.tierWeights;
  const teamId = (fpl.teams.find(t => t.name === club.name || t.short_name === club.short) || {}).id;
  const teamPlayers = fpl.players.filter(p => p.team === teamId);

  // Prefer enriched list with per-player continuous scores.
  const enriched = Array.isArray(club.players) && club.players.length
    ? club.players
    : [{ name: club.best, tier: 'best' }].concat(
        (club.first || []).map(n => ({ name: n, tier: 'first' })),
        (club.sub || []).map(n => ({ name: n, tier: 'sub' })),
        (club.youth || []).map(n => ({ name: n, tier: 'youth' }))
      );

  const ranked = enriched.map(p => {
    const match = teamPlayers.find(fp =>
      (fp.web_name || '').toLowerCase() === p.name.toLowerCase() ||
      (fp.second_name || '').toLowerCase().endsWith(p.name.toLowerCase()) ||
      (fp.web_name || '').toLowerCase().includes(p.name.toLowerCase())
    );
    const weight = (typeof p.score === 'number') ? p.score : tw[p.tier];
    return { name: p.name, tier: p.tier, weight, score: p.score, fpl: match };
  });

  const isOut = (p) => {
    if (!p) return false;
    if (['i', 's', 'u'].includes(p.status)) return true;
    if (p.status === 'd' && (p.chance_this === null || p.chance_this <= 50)) return true;
    return false;
  };

  const injured = ranked.filter(r => isOut(r.fpl));
  const wiscore = injured.reduce((s, r) => s + r.weight, 0);
  return { wiscore: Math.round(wiscore * 100) / 100, injured, ranked };
}

      <${Link} id="fixtures" label="Fixtures" />
      <${Link} id="clubs" label="Clubs" />
      <${Link} id="insights" label="Insights" />
      <${Link} id="methodology" label="Methodology" />
    </div>
    </div>
  `;
}

function InsightsStrip({ setView }) {
  const { insights } = window.__WI;
  const featured = (insights?.articles || []).filter(a => a.featured).slice(0, 3);

}

function InsightsList({ setView }) {

}

function LeagueTable({ setView, gw, historyData }) {
  const { squads, fpl, hist } = window.__WI;
  const seasonStarted = !!(fpl?.current_event && fpl.current_event >= 1);
  const [sortKey, setSortKey] = useState('wiscore');
  const [sortDir, setSortDir] = useState('desc');
  const [search, setSearch] = useState('');

  const rows = useMemo(() => {
    return squads.clubs.map(club => {
      const live = computeClubWIscore(club, fpl, squads);
      const hwi = seasonStarted ? ((hist?.clubs?.[club.name]?.wiscore) || []) : [];
      const hlp = seasonStarted ? ((hist?.clubs?.[club.name]?.league_position) || []) : [];
      // GW indexing: 1-based
      const wAtGw = hwi[gw - 1] ?? live.wiscore;
      const lpAtGw = hlp[gw - 1] ?? null;
      const wPrev = hwi[gw - 2];
      const lpPrev = hlp[gw - 2];
      const wDelta = (wPrev !== undefined) ? wAtGw - wPrev : 0;
      const lpDelta = (lpPrev !== undefined && lpAtGw !== null) ? lpPrev - lpAtGw : 0; // +ve = climbed
      const zone = zoneFor(wAtGw, squads.zones);
      return { club, wiscore: wAtGw, lp: lpAtGw, zone, wDelta, lpDelta, liveInjured: live.injured.length };
    });
  }, [gw, squads, fpl, hist]);

  const filtered = rows.filter(r => r.club.name.toLowerCase().includes(search.toLowerCase()));
  const sorted = [...filtered].sort((a, b) => {
    const av = sortKey === 'club' ? a.club.name : a[sortKey];
    const bv = sortKey === 'club' ? b.club.name : b[sortKey];
    const m = sortDir === 'asc' ? 1 : -1;
    if (av < bv) return -1 * m;
    if (av > bv) return 1 * m;
    return 0;
  });

  function toggleSort(k) {
    if (sortKey === k) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(k); setSortDir(k === 'club' || k === 'lp' ? 'asc' : 'desc'); }
  }
  const ind = (k) => sortKey === k ? html`<span class="sort-ind">${sortDir === 'asc' ? '▲' : '▼'}</span>` : '';
  const topClub = rows.slice().sort((a, b) => b.wiscore - a.wiscore)[0];
  const [trendClub, setTrendClub] = useState(null);
  const [trendClub2, setTrendClub2] = useState(null);
  const trendClubName = trendClub || topClub.club.name;
  const trendClubName2 = trendClub2 || '';

  return html`
    <div>
      <div class="page-header">
        <div>
          <h2 class="page-title">League Table - Gameweek ${gw}</h2>
          <div class="page-sub">Click a club to see their injured list and gameweek trend</div>
        </div>
        <div class="toolbar">
          <input class="search-input" type="text" placeholder="Search club…" value=${search} onInput=${e => setSearch(e.target.value)} />
        </div>
      </div>

      <div class="league-table">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th onClick=${() => toggleSort('club')}>Club ${ind('club')}</th>
              <th onClick=${() => toggleSort('wiscore')}>Zone ${ind('wiscore')}</th>
              <th onClick=${() => toggleSort('lp')}>League Pos ${ind('lp')}</th>
              <!-- lp shows - when null (pre-season) -->
              <th>Δ WI (vs GW${Math.max(1, gw-1)})</th>
            </tr>
          </thead>
          <tbody>
            ${sorted.map((r, i) => html`
              <tr key=${r.club.name} onClick=${() => setView({ name: 'club', club: r.club.name })}>
                <td class="rank">${i + 1}</td>
                <td>
                  <div class="club-cell">
                    <${ClubBadge} club=${r.club.name} />
                    <div>
                      <div class="club-name">${r.club.name}</div>
                      <div class="delta">${r.liveInjured} player${r.liveInjured===1?'':'s'} flagged</div>
                    </div>
                  </div>
                </td>
                <td><span class="zone-pill" style=${{ background: r.zone.color }}>${r.zone.label}</span></td>
                <td>
                  <div class="lp-cell">
                    <strong>${r.lp ?? '-'}</strong>
                    ${r.lpDelta !== 0 ? html`<span class="delta ${r.lpDelta > 0 ? 'up' : 'down'}">${r.lpDelta > 0 ? '▲' : '▼'} ${Math.abs(r.lpDelta)}</span>` : html`<span class="delta">-</span>`}
                  </div>
                </td>
                <td>
                  <div class="delta ${r.wDelta > 0 ? 'down' : r.wDelta < 0 ? 'up' : ''}">${r.wDelta > 0 ? '+' : ''}${r.wDelta}</div>
                </td>
              </tr>
            `)}
          </tbody>
        </table>
      </div>

      <div class="grid-2">
        <div class="card">
          <h3 class="card-title">Most-affected clubs | GW${gw}</h3>
          <${TopClubsBarChart} data=${sorted.slice().sort((a,b)=>b.wiscore-a.wiscore).slice(0, 10)} />
        </div>
        <div class="card">
          <h3 class="card-title">Zone distribution | GW${gw}</h3>
          <${ZoneDistributionChart} rows=${sorted} zones=${squads.zones} />
        </div>
      </div>

      <div class="card" style=${{ marginTop: 18 }}>
        <div style=${{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12, marginBottom: 4 }}>
          <h3 class="card-title" style=${{ margin: 0 }}>League position vs WIscore | season trend</h3>
          <div style=${{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', maxWidth: '100%' }}>
            <select class="search-input" style=${{ width: 190, maxWidth: '100%', minWidth: 0 }} value=${trendClubName} onChange=${e => setTrendClub(e.target.value)}>
              ${squads.clubs.map(c => html`<option key=${c.name} value=${c.name}>${c.name}</option>`)}
            </select>
            <span style=${{ fontSize: 12, color: '#8a8985', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.06em' }}>vs</span>
            <select class="search-input" style=${{ width: 190, maxWidth: '100%', minWidth: 0 }} value=${trendClubName2} onChange=${e => setTrendClub2(e.target.value)}>
              <option value="">None</option>
              ${squads.clubs.map(c => html`<option key=${c.name} value=${c.name}>${c.name}</option>`)}
            </select>
          </div>
        </div>
        ${seasonStarted ? html`<${ClubTrendChart}
          club=${trendClubName} wiscore=${hist?.clubs?.[trendClubName]?.wiscore || []} lp=${hist?.clubs?.[trendClubName]?.league_position || []}
          club2=${trendClubName2 || null} wiscore2=${trendClubName2 ? (hist?.clubs?.[trendClubName2]?.wiscore || []) : null} lp2=${trendClubName2 ? (hist?.clubs?.[trendClubName2]?.league_position || []) : null}
        />` : html`<div class="empty-state">Trend charts unlock once GW1 kicks off.</div>`}
      </div>

      <div class="email-capture">
        <h3>Get injury alerts</h3>
        <p>Weekly zone changes for your club, straight to your inbox.</p>
        <form name="email-capture" method="POST" data-netlify="true" netlify-honeypot="bot-field" onSubmit=${(e) => { e.preventDefault(); const fd = new FormData(e.target); fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(fd).toString() }).then(() => { e.target.reset(); alert('Subscribed — thanks!'); }).catch(() => alert('Something went wrong, try again.')); }}>
          <input type="hidden" name="form-name" value="email-capture" />
          <p style=${{ display: 'none' }}><label>Don't fill this out: <input name="bot-field" /></label></p>
          <div class="email-capture-row">
            <input type="email" name="email" required placeholder="you@email.com" />
            <button type="submit">Subscribe</button>
          </div>
        </form>
        <div class="email-capture-note">Submissions land in your Netlify dashboard under Forms — no extra setup.</div>
      </div>
    </div>
  `;
}

        labels: data.map(d => d.club.name),

function ZoneDistributionChart({ rows, zones }) {
  const ref = useRef(null);
  useEffect(() => {
    const counts = zones.map(z => rows.filter(r => r.zone.label === z.label).length);
    const chart = new Chart(ref.current, {
      type: 'doughnut',
      data: {
        labels: zones.map(z => z.label),
        datasets: [{
          data: counts,
          backgroundColor: zones.map(z => z.color),
          borderColor: '#0b0b0d',
          borderWidth: 2,
        }],
      },
      options: {
        plugins: { legend: { position: 'right', labels: { color: '#f6f5f2', font: { size: 12 } } } },
      },
    });
    return () => chart.destroy();
  }, [rows, zones]);
  return html`<canvas ref=${ref}></canvas>`;
}

          tension: 0.3,
          pointRadius: 0,
        },
        {
          label: `${club2} | League position`,
          data: lp2,
          borderColor: '#f2c94c',
          yAxisID: 'y1',
          tension: 0.3,
          pointRadius: 0,
        }
      );
    }
    const chart = new Chart(ref.current, {
      type: 'line',
      data: { labels, datasets },
      options: {
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { labels: { color: '#f6f5f2' } } },
        scales: {
          x: { ticks: { color: '#8a8985', maxTicksLimit: 12 }, grid: { color: '#2a2a2e' } },
          y: { position: 'left', ticks: { color: '#ff3d2e' }, grid: { color: '#2a2a2e' }, title: { display: true, text: 'WIscore', color: '#ff3d2e' } },
          y1: { position: 'right', reverse: true, min: 1, max: 20, ticks: { color: '#21e6a1' }, grid: { display: false }, title: { display: true, text: 'League position', color: '#21e6a1' } },
        },
      },
    });
    return () => chart.destroy();
  }, [club, wiscore, lp, club2, wiscore2, lp2]);
  return html`<canvas ref=${ref}></canvas>`;
}

function SquadGrid({ club, squads }) {
  const tw = squads.tierWeights;
  // Build tier-grouped list with per-player scores (from enriched club.players when available)
  const playersByTier = { best: [], first: [], sub: [], youth: [] };
  if (Array.isArray(club.players) && club.players.length) {
    club.players.forEach(p => (playersByTier[p.tier] || playersByTier.youth).push(p));
  } else {
    playersByTier.best.push({ name: club.best, tier: 'best', score: tw.best });
    (club.first || []).forEach(n => playersByTier.first.push({ name: n, tier: 'first', score: tw.first }));
    (club.sub || []).forEach(n => playersByTier.sub.push({ name: n, tier: 'sub', score: tw.sub }));
    (club.youth || []).forEach(n => playersByTier.youth.push({ name: n, tier: 'youth', score: tw.youth }));
  }
  const groups = [
    { label: 'Best Player', tier: 'best', cls: 'tier-best', members: playersByTier.best },
    { label: 'First Choice', tier: 'first', cls: 'tier-first', members: playersByTier.first },
    { label: 'First Sub', tier: 'sub', cls: 'tier-sub', members: playersByTier.sub },
    { label: 'Youth / Rotation', tier: 'youth', cls: 'tier-youth', members: playersByTier.youth },
  ];
  return html`
    <div style=${{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(240px,1fr))', gap: 18 }}>
      ${groups.map(g => {
        const abbr = { best: 'B', first: '1', sub: 'S', youth: 'Y' }[g.tier];
        return html`
        <div key=${g.label}>
          <div style=${{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#8a8985', fontWeight: 600, marginBottom: 10 }}>
            <span class=${"player-tier " + g.cls} style=${{ display: 'inline-grid', width: 20, height: 20, fontSize: 10, verticalAlign: 'middle', marginRight: 6, borderRadius: 10 }}>${abbr}</span>
            ${g.label}
          </div>
          ${g.members
              .slice()
              .sort((a, b) => (b.score || 0) - (a.score || 0))
              .map(m => html`
                <div key=${m.name} style=${{ fontSize: 13, padding: '4px 0', color: '#f6f5f2' }}>${m.name}</div>
              `)}
        </div>
      `;
      })}
    </div>
  `;
}

function ClubsIndex({ setView }) {

  return html`
    <div>

        <h2 class="page-title">All clubs</h2>
      </div>
      <div style=${{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(260px,1fr))', gap: 14 }}>
        ${squads.clubs.map(club => {
          const live = computeClubWIscore(club, fpl, squads);
          const zone = zoneFor(live.wiscore, squads.zones);
          return html`
            <div key=${club.name} class="card" style=${{ cursor: 'pointer', padding: 18 }} onClick=${() => setView({ name: 'club', club: club.name })}>
              <div style=${{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <${ClubBadge} club=${club.name} size=${40} />
                <div style=${{ flex: 1, minWidth: 0 }}>
                  <div style=${{ fontWeight: 600, fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${club.name}</div>
                  <div style=${{ fontSize: 11, color: '#8a8985' }}>${club.short}</div>
                </div>
                <div style=${{ textAlign: 'right' }}>
                  <div style=${{ fontSize: 22, fontWeight: 700, lineHeight: 1 }}>${live.wiscore.toFixed(1)}</div>
                  <div style=${{ fontSize: 10, color: '#8a8985', textTransform: 'uppercase', letterSpacing: '0.06em' }}>WIscore</div>
                </div>
              </div>
              <div style=${{ marginTop: 12, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <span class="zone-pill" style=${{ background: zone.color }}>${zone.label}</span>

        })}

  `;
}

function Methodology() {
  const { squads } = window.__WI;
  const max = squads.tierCounts.best * squads.tierWeights.best
    + squads.tierCounts.first * squads.tierWeights.first
    + squads.tierCounts.sub * squads.tierWeights.sub
    + squads.tierCounts.youth * squads.tierWeights.youth;

  return html`
    <div>
      <div class="page-header">
        <h2 class="page-title">Methodology</h2>
      </div>
      <div class="card">
        <div class="meth-section">
          <h3>What WIscore measures</h3>
          <p>WIscore is a composite index quantifying the aggregate loss of playing-squad value a club is currently exposed to through unavailability. Rather than a simple injury count, it's a weighted structural measure - every absence is scored against that player's modelled contribution to the team, so the loss of a first-team talisman registers very differently to the loss of a fringe rotation option.</p>
          <p>A player is treated as unavailable if their status resolves to injured, suspended, or otherwise unfit, or listed as doubtful with a low likelihood of selection for the upcoming fixture.</p>
        </div>
        <div class="meth-section">
          <h3>How the model is built</h3>
          <p>WIscore's player-importance model was trained on a full season of underlying performance, role, and impact data across the league, then calibrated into a proprietary weighting function that maps each player to a single importance coefficient. The function accounts for squad hierarchy, positional scarcity, sustained statistical output, and team-context effects, combined through a bespoke aggregation method developed specifically for this index.</p>
          <p>The individual coefficients and the full aggregation methodology are kept proprietary. What's published here is the resulting club-level WIscore and its corresponding severity zone - the output of the model, not its internal mechanics.</p>
        </div>
        <div class="meth-section">
          <h3>Squad structure</h3>
          <div class="tier-grid">
            <div class="tier-card"><div class="tier-card-name">Best</div><div class="tier-card-value" style=${{ color: 'var(--tier-best)', fontSize: '22px' }}>Highest</div><div class="tier-card-count">${squads.tierCounts.best} player per club</div></div>
            <div class="tier-card"><div class="tier-card-name">First Choice</div><div class="tier-card-value" style=${{ color: 'var(--tier-first)', fontSize: '22px' }}>High</div><div class="tier-card-count">${squads.tierCounts.first} players per club</div></div>
            <div class="tier-card"><div class="tier-card-name">First Sub</div><div class="tier-card-value" style=${{ color: 'var(--tier-sub)', fontSize: '22px' }}>Medium</div><div class="tier-card-count">${squads.tierCounts.sub} players per club</div></div>
            <div class="tier-card"><div class="tier-card-name">Youth / Rotation</div><div class="tier-card-value" style=${{ color: 'var(--tier-youth)', fontSize: '22px' }}>Low</div><div class="tier-card-count">${squads.tierCounts.youth} players per club</div></div>
          </div>
        </div>
        <div class="meth-section">
          <h3>Severity zones</h3>
          <div class="zone-grid">
            ${squads.zones.slice().sort((a,b)=>a.min-b.min).map((z) => html`
              <div key=${z.label} class="zone-card" style=${{ background: z.color }}>
                <div class="zone-card-label">${z.label}</div>
              </div>
            `)}
          </div>
        </div>
      </div>
    </div>
  `;
}

/* ---------------- Root ---------------- */
function App() {
  const [view, setView] = useState({ name: 'table' });
  const [gw, setGw] = useState(1);
  const { fpl, hist } = window.__WI;
  const seasonStarted = !!(fpl?.current_event && fpl.current_event >= 1);

  // sync gw initial value to the current FPL event if available
  useEffect(() => {
    const ev = fpl?.current_event;
    if (ev && ev >= 1 && ev <= 38) setGw(ev);
  }, [fpl]);

  return html`
    <div class="app">
      <${Nav} view=${['article'].includes(view.name) ? 'insights' : ['fixture'].includes(view.name) ? 'fixtures' : view.name} setView=${setView} fpl=${fpl} />
      <div class="container">
        ${!seasonStarted ? html`
          <div class="alert">
            <strong>Pre-season.</strong> Gameweek 1 hasn't kicked off yet - the table below reflects squads and any current injury news only. Gameweek history and trend charts will populate once the season starts.
          </div>
        ` : (view.name === 'table' || view.name === 'clubs' || view.name === 'fixtures') ? html`
          <div class="gw-bar">
            <span class="gw-label">Gameweek</span>
            <span class="gw-value">GW ${gw}</span>
            <input type="range" min="1" max=${fpl?.current_event || 1} value=${gw} onInput=${e => setGw(Number(e.target.value))} />
            <div class="gw-presets">
              ${[1, 10, 19, 28, 38].filter(g => g <= (fpl?.current_event || 1)).map(g => html`
                <span key=${g} class=${"gw-preset " + (gw === g ? "active" : "")} onClick=${() => setGw(g)}>GW${g}</span>
              `)}
            </div>
          </div>
        ` : ''}

        ${fpl?._synthetic ? html`
          <div class="alert">
            <strong>Demo mode.</strong> You're viewing synthetic injury data. Run <code>node scripts/fetch-fpl.js</code> to replace <code>public/fpl-data.json</code> with live FPL data, then refresh.
          </div>
        ` : ''}

        ${view.name === 'table' ? html`<${LeagueTable} setView=${setView} gw=${gw} />` : ''}
        ${view.name === 'table' ? html`<${InsightsStrip} setView=${setView} />` : ''}
        ${view.name === 'fixtures' ? html`<${FixturesList} setView=${setView} gw=${gw} />` : ''}
        ${view.name === 'fixture' ? html`<${FixtureDetail} fixtureId=${view.id} setView=${setView} />` : ''}
        ${view.name === 'clubs' ? html`<${ClubsIndex} setView=${setView} />` : ''}
        ${view.name === 'club' ? html`<${ClubDetail} clubName=${view.club} setView=${setView} gw=${gw} />` : ''}
        ${view.name === 'insights' ? html`<${InsightsList} setView=${setView} />` : ''}
        ${view.name === 'article' ? html`<${ArticleView} articleId=${view.id} setView=${setView} />` : ''}
        ${view.name === 'methodology' ? html`<${Methodology} />` : ''}
      </div>
    </div>
  `;
}

bootstrap().then(() => {
  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
}).catch(err => {
  document.getElementById('root').innerHTML = `<div style="padding:48px;color:#ff8b8b;font-family:Inter,sans-serif">
    <h2>Could not load data</h2>
    <p>${err.message}</p>
    <p style="color:#8a8985">Make sure the file is served from a local web server (the data files are loaded via fetch() and won't work from a <code>file://</code> URL in modern browsers).</p>
    <pre style="background:#17181b;padding:16px;border-radius:8px;font-size:13px;line-height:1.6">cd wiscore-app
python3 -m http.server 8000
# then open http://localhost:8000</pre>
  </div>`;
});
</script>
</body>
</html>
